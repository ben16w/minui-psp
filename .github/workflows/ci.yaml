---
name: "ci"

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

permissions:
  attestations: write
  id-token: write
  contents: write

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Create release
        run: make clean build release

      - name: Get Pak Name
        id: pak-name
        run: |
          echo "PAK_NAME=$(jq -r .name pak.json)" >> $GITHUB_OUTPUT

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: "${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          path: "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

      - name: Build device test bundle
        run: make test-bundle

      - name: Upload device test bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: psp-device-tests
          path: dist/psp-device-tests.tar.gz

      - name: Lint shell scripts
        run: shellcheck launch.sh tests/device/run.sh tests/device/e2e.sh

      - name: Check release contents
        run: |
          zip="dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          for f in launch.sh pak.json bin/jpg2bmp; do
            unzip -l "$zip" | grep -q " $f$" || { echo "missing from release: $f"; exit 1; }
          done
          if unzip -l "$zip" | grep -qE " (src|tests)/"; then
            echo "src/ or tests/ leaked into the release"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/rel" && mkdir -p "$RUNNER_TEMP/rel"
          unzip -q "$zip" -d "$RUNNER_TEMP/rel"
          file "$RUNNER_TEMP/rel/bin/jpg2bmp" | grep -q "ARM aarch64"

      # Runs the real launch.sh and the shipped aarch64 jpg2bmp (this runner is arm64)
      # against a stub PPSSPP. Tests the unpacked release, not the repository checkout.
      - name: Test Game Switcher preview
        run: SRC_PAK="$RUNNER_TEMP/rel" OUT_DIR="$RUNNER_TEMP/test-out" sh tests/device/run.sh

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: preview-test-logs
          path: ${{ runner.temp }}/test-out

  test-release:
    name: test-release
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get Pak Name
        id: pak-name
        run: |
          echo "PAK_NAME=$(jq -r .name pak.json)" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: "${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          path: "dist"

      - name: Validate Artifact exists
        run: |
          if [ ! -f "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip" ]; then
            echo "Artifact does not exist"
            exit 1
          fi
